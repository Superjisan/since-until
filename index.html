<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Since Until</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <script>
    try {
      var savedTheme = localStorage.getItem('since-until:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button"></button>
  <main>
    <header class="site-header">
      <img src="icons/icon.svg" alt="" width="48" height="48">
      <h1>Since Until</h1>
    </header>
    <p id="direction" class="direction" aria-live="polite"></p>
    <h2 id="name" class="countdown-name"></h2>
    <div id="clock" class="clock" role="timer" aria-live="off"></div>
    <p id="target-label" class="target-label"></p>

    <details class="panel">
      <summary>Examples</summary>
      <ul id="example-list"></ul>
    </details>

    <details class="panel">
      <summary>Create your own since/until clock 🕐</summary>
      <form id="config">
        <label>Name
          <input id="input-name" type="text" maxlength="60" placeholder="e.g. Launch day">
        </label>
        <label>Date and time (your local time)
          <input id="input-date" type="datetime-local" required>
        </label>
        <fieldset>
          <legend>Units</legend>
          <p class="hint">Auto hides leading zero units, and hours, minutes and seconds beyond 20 years.</p>
          <div id="unit-grid" class="unit-grid"></div>
        </fieldset>
      </form>
      <div class="share">
        <button id="share-button" type="button">Copy share link</button>
        <input id="share-url" type="text" readonly aria-label="Share link">
        <span id="share-status" role="status"></span>
      </div>
      <p id="offline-status" class="hint"></p>
    </details>
  </main>
  <script src="js/countdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
